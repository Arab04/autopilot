name: Sinovlar
on: [push, pull_request]
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy matplotlib
      - run: python sinovlar.py
        working-directory: sim/balance
  trotuar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install matplotlib
      - run: python sinovlar.py 100
        working-directory: sim/world
  yol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install matplotlib
      - run: python yol_sinovlar.py 150
        working-directory: sim/world
      - run: python xarita_sinovlar.py
        working-directory: sim/world
  chirchiq:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python xarita_sinovlar.py --chirchiq 2
        working-directory: sim/world
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python operator_sinovlar.py
        working-directory: sim/world
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test && make CC=clang clean test
        working-directory: firmware/xavfsizlik
      - run: python sim_sinov.py 100
        working-directory: firmware/xavfsizlik

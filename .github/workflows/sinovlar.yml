name: Sinovlar
on: [push, pull_request]
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy matplotlib
      - run: python sinovlar.py
        working-directory: sim/balance

databaseChangeLog:
  - changeSet:
      id: 006-sales
      author: crm
      changes:
        - createTable:
            tableName: sales
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: warehouse_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: customer_name
                  type: VARCHAR(120)

              - column:
                  name: customer_phone
                  type: VARCHAR(30)

              - column:
                  name: subtotal
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: tax_amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: total
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: payment_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
